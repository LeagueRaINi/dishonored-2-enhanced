[General]
; 1 = skip the boot logo/legal videos (patched in memory; deleting the .bk2 files hangs the game instead)
SkipIntro=1
; Frame limiter: -1 = in-game setting, 0 = unlocked, N = cap at N fps (30..300)
FpsLimit=0
; Frame counter: 0 = off, 1 = minimal, 2 = frame time (graph, 1% low), 3 = FSR details, 4 = full, 5 = benchmark
FpsCounter=2
; Frames the CPU may queue ahead of the GPU: 0 = driver default (3), 1 = lowest latency, 2, 3
MaxQueuedFrames=0
; 1 = render at RenderScale (applied a few seconds after launch); Mode=upscale turns this on
ForceScale=0
; Per-axis render scale: 0.77 = Ultra Quality, 0.667 = Quality, 0.588 = Balanced, 0.5 = Performance
; (snapped so the render size is a multiple of 8 pixels)
RenderScale=0.667
; 1 = cvars the retail build locks ("CANNOT be set in retail") can be set from the console
UnlockCvars=1
; 1 = engine settings beyond the menu's Ultra (shadows, LOD, filtering), restored when off
UltraPlus=0

[Keys]
; Virtual key codes. F5/F9 are the game's quicksave/quickload.
; 113 = F2 settings overlay, 117 = F6 FSR on/off, 118 = F7 reduced resolution on/off,
; 119 = F8 capture one frame (log + upscaler inputs), 121 = F10 FSR debug view
Overlay=113
ToggleFSR=117
ToggleScale=118
Capture=119
FSRDebugView=121
; 122 = F11 benchmark recording start/stop (frame counter mode 5 shows the results)
Benchmark=122

[FSR]
; Replaces the engine TAA with FSR (in-game Anti-aliasing must be TAA)
Enabled=1
; upscale = render at RenderScale, FSR upscales before post-processing (which then runs at display resolution)
; native  = FSR anti-aliases at render resolution
Mode=upscale
; 0..1 FSR sharpening (RCAS); 0.3-0.6 works well when upscaling
Sharpness=0.4
; 1 = 32-phase Halton jitter covering a full render pixel (recommended), 0 = the game's 8-phase pattern
HaltonJitter=1
; 1 = the engine's motion vectors contain the per-frame jitter delta (they don't in Dishonored 2)
MotionJitterCancellation=0
; Pin an FSR version for comparison: 4.1.1, 3.1.5 or 2.3.4 (empty = newest)
Version=
; 1 = FSR validates its inputs and logs warnings to d2enhanced\logs\d2enhanced.log (costs some performance)
DebugChecking=0
; 1 = texture mip bias log2(render scale) - 1 while upscaling, so textures stay as sharp as at display resolution
MipBias=1

[HDR]
; HDR10 output while Windows HDR is on for the game's display (read at startup; SDR otherwise)
Enabled=1
; nits of SDR white (HUD, menus, scene mid tones)
PaperWhite=200
; highlight ceiling in nits, 0 = what the display reports
PeakNits=0
; contrast above mid grey, 1.0 = the scene's own, up to 2.0
HighlightBoost=1.3

[SSGI]
; screen-space global illumination (bounce light), added to FSR's input (upscale mode)
Enabled=1
Strength=1.0
; world units bounce light travels, and the assumed thickness of objects
Radius=2.0
Thickness=0.5
; quality: directions per pixel, samples per direction
Slices=3
Steps=8
; 0..1 extra contact shadowing on top of the game's ambient occlusion
AmbientOcclusion=0.0
; reflectance assumed where a surface's colour is unknown (0.1..0.9)
SurfaceReflectance=0.45

[SSR]
; screen-space reflections, replacing the game's cubemap reflection where a ray hits (needs material capture)
Enabled=1
Strength=1.0
; rougher surfaces keep the cubemap only
MaxRoughness=0.6
; fraction of its distance a hit may lie behind a surface
Thickness=0.05
Steps=32
MaxDistance=40
; 0..1 the GI's visibility darkens the cubemap reflection in occluded places (needs SSGI)
SpecularOcclusion=1.0

[Materials]
; 1 = patch the lighting shaders to output material data for GI and SSR (read at startup)
Capture=1
; 1 = alpha-blended draws (decals: puddles, wet patches) blend their material data in
Decals=1

[Grading]
; colour grading in the game's tonemap pass (SDR and HDR); the values below are neutral (the game's own look)
Enabled=0
; exposure in EV
Exposure=0.0
Contrast=1.0
Saturation=1.0
; -1..1 saturation boost that spares already saturated colours
Vibrance=0.0
; -1 cool .. +1 warm, -1 green .. +1 magenta
Temperature=0.0
Tint=0.0
; 0..1 strength of the game's own colour grading LUT
GameLook=1.0

[Debug]
; 1 = write every shader the game creates to d2enhanced\captures\shaders (for offline analysis)
DumpShaders=0
