[workspace]
resolver = "3"
members = ["crates/void-res", "crates/void-formats", "crates/void-tool", "crates/void-reflect", "crates/void-inject", "crates/void-assets", "crates/void-rt"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeagueRaINi/dishonored-2-enhanced"
publish = false

[workspace.dependencies]
void-res = { path = "crates/void-res" }
void-formats = { path = "crates/void-formats" }
flate2 = "1.1"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive", "env"] }
iced-x86 = { version = "=1.21.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
